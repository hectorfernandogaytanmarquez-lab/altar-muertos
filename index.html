<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
    <title>Altar de Muertos AR - Principal</title>

    <!-- A-Frame y AR.js para Patrones -->
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.2.0/dist/aframe-extras.min.js"></script>
    <script src="./js/espectros.js"></script>

    <link rel="stylesheet" href="./css/style.css" />
    <style>
        body { margin: 0; overflow: hidden; }
        .ar-instruction {
            position: absolute; top: 10px; width: 100%; text-align: center; color: #FFFFFF;
            font-family: sans-serif; font-size: 14px; background: rgba(0, 0, 0, 0.6); padding: 8px 0; z-index: 999; pointer-events: none;
        }
    </style>
</head>

<body>
    <div class="ar-instruction">Apunta la cámara al marcador para ver el Altar 3D y los Espectros</div>

    <!-- Botón flotante para cambiar a la página del video -->
    <div class="ui-container">
        <a href="./video.html" class="btn-ar">Ver Video Conmemorativo 🎥</a>
    </div>

    <a-scene 
        embedded 
        renderer="antialias: true; alpha: true; logarithmicDepthBuffer: true;" 
        arjs="trackingMethod: best; sourceType: webcam; debugUIEnabled: false;">

        <a-assets>
            <a-asset-item id="modelo-altar" src="./assets/modelos/altar.glb"></a-asset-item>
            <a-asset-item id="modelo-ajolote" src="./assets/modelos/ajolote/scene.gltf"></a-asset-item>
        </a-assets>

        <!-- Luces -->
        <a-entity light="type: ambient; intensity: 0.9"></a-entity>
        <a-entity light="type: directional; intensity: 0.5" position="1 2 1"></a-entity>

        <!-- MARCADOR DE PATRÓN -->
        <a-marker type="pattern" url="./assets/nft/marcador.patt">
            
            <!-- 1. Modelo 3D del Altar -->
            <a-entity
                gltf-model="#modelo-altar"
                scale="0.8 0.8 0.8"
                position="0 0 0"
                rotation="-90 0 0">
            </a-entity>

            <!-- 2. Ajolotes Espectrales Animados -->
            <a-entity 
                position="0 1 0" 
                animation="property: rotation; to: 0 360 0; loop: true; dur: 12000; easing: linear">
                <a-entity
                    gltf-model="#modelo-ajolote"
                    scale="0.2 0.2 0.2"
                    position="1.5 0 0"
                    animation-mixer="clip: *; loop: repeat"
                    efecto-espectro="opacidad: 0.7; colorBrillo: #ff007f; intensidad: 0.6"
                    animation__flotar="property: position; dir: alternate; dur: 2000; easing: easeInOutSine; loop: true; to: 1.5 0.4 0">
                </a-entity>
            </a-entity>

        </a-marker>

        <a-entity camera></a-entity>
    </a-scene>
</body>
</html>
