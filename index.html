<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>Altar de Muertos AR - Principal</title>
    <link rel="stylesheet" href="./css/style.css" />

    <!-- Librerías A-Frame y AR.js para Patrones (Pattern) -->
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.2.0/dist/aframe-extras.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    
    <script src="./js/espectros.js"></script>
    <script src="./js/main.js"></script>
  </head>

  <body style="margin: 0; overflow: hidden;">
    <div class="ui-container">
      <a href="./video.html" class="btn-ar">Ver Video Conmemorativo 🎥</a>
    </div>

    <!-- Usamos a-scene con arjs normal para patrones -->
    <a-scene
      vr-mode-ui="enabled: false;"
      renderer="logarithmicDepthBuffer: true;"
      embedded
      arjs="trackingMethod: best; sourceType: webcam; debugUIEnabled: false; detectionMode: mono_and_matrix; matrixCodeType: 3x3;">

      <!-- Marcador basado en .patt -->
      <a-marker type="pattern" url="./assets/nft/marcador.patt">

        <!-- 1. MODELO DEL ALTAR PRINCIPAL -->
        <a-entity
          gltf-model="./assets/modelos/altar.glb"
          scale="0.8 0.8 0.8"
          position="0 0 0"
          rotation="-90 0 0">
        </a-entity>

        <!-- 2. ÓRBITA DE ESPECTROS (Ajolote) -->
        <a-entity 
          position="0 1 0" 
          animation="property: rotation; to: 0 360 0; loop: true; dur: 12000; easing: linear">
          
          <a-entity
            gltf-model="./assets/modelos/ajolote/scene.gltf"
            scale="0.2 0.2 0.2"
            position="1.5 0 0"
            animation-mixer="clip: *; loop: repeat"
            efecto-espectro="opacidad: 0.7; colorBrillo: #ff007f; intensidad: 0.6"
            animation__flotar="property: position; dir: alternate; dur: 2000; easing: easeInOutSine; loop: true; to: 1.5 0.4 0">
          </a-entity>

        </a-entity>

      </a-marker>

      <a-entity camera></a-entity>
    </a-scene>
  </body>
</html>
