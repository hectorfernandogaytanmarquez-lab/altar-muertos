<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>Altar de Muertos AR - Principal</title>
    <link rel="stylesheet" href="./css/style.css" />

    <!-- Librerías A-Frame y AR.js NFT -->
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.2.0/dist/aframe-extras.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar-nft.js"></script>
    
    <!-- Tu componente de espectros -->
    <script src="./js/espectros.js"></script>
  </head>

  <body>
    <!-- Botón flotante para ir a la página del video -->
    <div class="ui-container">
      <a href="./video.html" class="btn-ar">Ver Video Conmemorativo 🎥</a>
    </div>

    <a-scene
      vr-mode-ui="enabled: false;"
      renderer="logarithmicDepthBuffer: true;"
      embedded
      arjs="trackingMethod: best; sourceType: webcam; debugUIEnabled: false;">

      <!-- Pre-carga del Altar y del Ajolote -->
      <a-assets>
        <a-asset-item id="modelo-altar" src="./assets/modelos/altar.glb"></a-asset-item>
        <a-asset-item id="modelo-ajolote" src="./assets/modelos/ajolote/scene.gltf"></a-asset-item>
      </a-assets>

      <!-- Marcador de imagen único (apunta a tus archivos .fset, .fset3, .iset) -->
      <a-nft
        type="nft"
        url="./assets/nft/altar-base"
        smooth="true"
        smoothCount="10"
        smoothTolerance="0.01"
        smoothThreshold="5">

        <!-- 1. MODELO DEL ALTAR PRINCIPAL -->
        <a-entity
          gltf-model="#modelo-altar"
          scale="80 80 80"
          position="50 0 -100"
          rotation="-90 0 0">
        </a-entity>

        <!-- 2. TU PARTE: Órbita de Espectros (Ajolote) alrededor del altar -->
        <a-entity 
          position="50 40 -100" 
          animation="property: rotation; to: 0 360 0; loop: true; dur: 12000; easing: linear">
          
          <a-entity
            gltf-model="#modelo-ajolote"
            scale="15 15 15"
            position="70 0 0"
            animation-mixer="clip: *; loop: repeat"
            efecto-espectro="opacidad: 0.7; colorBrillo: #ff007f; intensidad: 0.6"
            animation__flotar="property: position; dir: alternate; dur: 2000; easing: easeInOutSine; loop: true; to: 70 25 0">
          </a-entity>

        </a-entity>

      </a-nft>

      <a-entity camera></a-entity>
    </a-scene>
  </body>
</html>
